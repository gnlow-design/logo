<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -50 200 100" fill="none">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Faculty+Glyphic&amp;display=swap');
        text {
            font-family: "Faculty Glyphic";
            fill: url(#grad);
            text-anchor: middle;
            dominant-baseline: central;
            font-size: 84px;
            letter-spacing: -4px;
            /* transform: skewX(-5deg) scaleY(0.8); */
        }
    </style>
    <defs>
